<div class="admin">
  <button class="admin__menu-toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  @if (menuOpen()) {
    <div class="admin__overlay" (click)="closeMenu()"></div>
  }

  <aside class="admin__sidebar" [class.admin__sidebar--open]="menuOpen()">
    <nav class="admin__nav">
      @for (entity of entities; track entity.key) {
        <button
          class="admin__nav-item"
          type="button"
          [class.admin__nav-item--active]="selectedKey() === entity.key"
          (click)="selectEntity(entity)"
        >{{ entity.label }}</button>
      }
    </nav>
  </aside>

  <main class="admin__content">
    @switch (selectedKey()) {
      @case ('restaurants') {
        <app-restaurant-list />
      }
      @case ('menu-categories') {
        <app-menu-category-list />
      }
      @case ('menu-items') {
        <app-menu-item-list />
      }
      @case ('tables') {
        <app-table-list />
      }
      @default {
        <p>Selecione uma entidade para gerenciar.</p>
      }
    }
  </main>
</div>
