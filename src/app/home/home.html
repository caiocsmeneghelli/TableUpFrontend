<header class="home__header">
  <h1 class="home__title">Restaurantes</h1>
</header>

<div class="home__restaurants">
  @for (restaurant of restaurants(); track restaurant.id) {
    <a class="restaurant-card" [routerLink]="['/restaurant', restaurant.id]">
      <h2 class="restaurant-card__name">{{ restaurant.name }}</h2>
      <p class="restaurant-card__description">{{ restaurant.description }}</p>
    </a>
  }
</div>
