<main class="table">
  <header class="table__header">
    @if (loading()) {
      <p class="table__greeting">Carregando...</p>
    } @else if (error()) {
      <p class="table__error">{{ error() }}</p>
    } @else if (table(); as table) {
      <p class="table__greeting">Bem-vindo ao {{ table.restaurantName }}!</p>
      <h1 class="table__title">Mesa {{ table.tableNumber }}</h1>
      <p class="table__subtitle">O que deseja fazer?</p>
    }
  </header>

  @if (table()) {
    <nav class="table__actions">
      <a class="table__action table__action--primary" routerLink="menu">
        <span class="table__action-icon" aria-hidden="true">🍽️</span>
        <span class="table__action-label">Cardápio</span>
      </a>

      <button class="table__action" type="button">
        <span class="table__action-icon" aria-hidden="true">🧾</span>
        <span class="table__action-label">Conta</span>
      </button>
    </nav>
  }
</main>
